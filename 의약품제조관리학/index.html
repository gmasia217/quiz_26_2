        { guideline: "[2024 의약품제조관리학 중간]", text: "37. 적합판정을 받은 제형 또는 제조방법의 변경은 총리령으로 정하는 경미한 사항에 속한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "38. 안정성 시험과 관련하여, 시판용으로 제조하는 임의의 제조단위에 대하여 최소 3개 이상의 제조단위를 선정하여 장기보존시험을 해야한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "39. 와파린의 의약품동등성 시험을 진행하려고 할 때, 모든 조건에서 30분 이내에 85% 이상 용출하고 용출의 동등성이 확인되는 경우 생물학적동등성 시험을 비교용출시험자료로 갈음할 수 있다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "40. QTPP는 원하는 제품의 품질을 보증하기 위하여 적절한 한도, 범위 또는 분포 내에 있어야 하는 물리적, 화학적, 생물학적 또는 미생물학적 성질이나 특성을 말한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "41. QbD에서 DS는 의약품의 안전성과 유효성과 관련한 품질문제에 대한 유연한 대처를 가능하게 하는 요소로서 기능한다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "42. ICH Q10은 의약품 품질 시스템 관련, QRM과 가장 관련있는 ICH 가이드라인이다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "43. 기존접근방식에 비하여 QbD 접근 방식은 다변량 싫머 수행, 품질관리전략 및 공정 완건성에 더욱 중점을 두고 있다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "44. 공정분석기술은 분석 부담을 줄이고 제품 품질을 개선하여, 최종제품의 시험에만 의존하는 것보다 적합 여부를 효과적으로 확인할 수 있도록 해준다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "45. 품질위험관리에서 위험우선순위는 심각도, 발생도, 검출도에 비례한다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "46. 설계공간은 품질 보증과 연관된 공정변수와 투입변수의 다차원적인 조합과 상호작용을 말하며, 설계공간 안에서의 작업은 변경으로 간주되지 않는다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "47. 일반적으로 QbD를 활용한 제품 개발을 할 때는 QRM -> COA -> QTPP -> Design space -> Control strategy 순서로 확립하게 된다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "48. QTPP 는 제품의 품질 목표 사항으로서 의약품의 품질을 보장하기 위한 특성을 요약한 것이며, 의약품의 환자에 대한 영향은 QTPP를 정할 때 고려 대상이 아니다", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "49. 공정밸리데이션의 실행 시, 다른 부서들의 간섭을 최소화하기 위하여 품질부증부서가 독립적으로 밸리데이션의 계획, 시행, 조정, 결과정리, 보고 및 사후관리를 담당하게 하는 것이 바람직하다", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "50. 프로젝트의 적격성평가는 반드시 Validation Master Plan과 별개로 다루어져야하며, 이를 위해 Qualification master plan을 작성할 수 있다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "51. 밸리데이션 실시계획서에는 사용하는 자재, 규정일탈 및 수정 등에 대한 내용이 포함되어야하며, 간단명료해야한다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "52. 밸리데이션 결과보고서의 양식과 구성은 밸리데이션 종합계획서에 바탕을 두어야하며 실제의 기계장치 및 시설과 공정 파라미터를 사용한 제조기록서 내용을 포함해야 한다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "53. 공정밸리데이션을 실시하기 전에 시설, 시스템, 장비에 대한 적격성 확인이 필요하며, 공정밸리데이션을 완료한 이후에는 제조용수, 공기조화시스템 등에 대한 밸리데이션이 필수로 시행되어야 한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "54. 밸리데이션을 통하여 기업은 생산성 증가 및 원가절감이 가능하며, 산업적인 측면에서 국제 경쟁력 확보가 가능하다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "55. Validation Protocol 이란 밸리데이션의 적절한 실시를 위한 방법, 조직, 실시대상 등의 전체적인 계획을 요약, 정리한 것을 의미한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "56. 제조공정 밸리데이션을 사전에 진행하여 문서화한 뒤 각 공정과 연관된 적격성평가를 진행해야 한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "57. 연간 생산하는 제조단위가 10개 이하 의약품인 사유로 예측적 밸리데이션을 부득이하게 실시하지 못하는 경우 동시적 밸리데이션을 시행할 수 있다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "58. A 제조소에서 휴미라(아달리무맙, 바이오의약품)에 대해 밸리데이션을 실시하고 바이오시밀러를 생산하던 와중 A 제조소를 다른 지역으로 이전할 경우, 해당 의약품의 공급 차질이 우려되는 경우에는 동시적 밸리데이션을 실시할 수 있다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "59. 알러지성 결막염 치료 점안제 A (Olopatadine HCI 7.76mg 함유) 와 울혈성 심부전 치료제 정제 B (Digoxin 0.25 mg) 중에서 공정밸리데이션 우선순위는 A 이다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "60. 공정개발과 관련하여, 일반적으로 공정 특성 분석은, 공정변수 부하시험 이후 실시하게 된다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "61. 실제 제조단위제품 공정개발 순서는 일반적으로 1) 적격성 평가 실시 -> 2) 공정 밸리데이션 실시 -> 3) 생산규모 증대 연구 순서로 진행된다", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "62. 밸리데이션 결과 판정 및 평가, 밸리데이션 문서의 보관에 관한 사항은 밸리데이션 책임자의 업무이다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "63. 공정밸리데이션 실시 순서는 일반적으로 다음과 같은 순서로 이루어질 수 있다. 1) 공정밸리데이션 수행 조직 구성 -> 2) 제조설비 및 장비의 적격성 평가 -> 3) 공정밸리데이션 종합계획서 수립 -> 4) 실시계획서 작성 -> 5) 공정밸리데이션 실시 -> 6) 문서화", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "64. 밸리데이션 공정 결과물의 정의, 밸리데이션 결과 등은 공정 밸리데이션 프로그램 종합계획서에 포함되어있어야 하는 항목이다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "65. 공정밸리데이션 수행을 위해서는 원료의약품 및 중요첨가제에 대해서는 같은 제조번호인 것으로 시험하는 것이 바람직하며 작업일자 및 작업시간대는 달리하여 연속 배치로 작업해야 한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "66. 공정흐름도를 공정밸리데이션 수행 전에 작성하여야 하며 제조기록서는 밸리데이션 완료 후 위험분석의 결과를 근거로 하여 작성한 뒤 결과보고서에 첨부해야한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "67. 안정성에 문제가 있는 경구 항생제 A, 실용량이 10ml 인 주사제 앰플 B, 항균 안연고제 C 중, 공정밸리데이션에서 가장 높은 우선순위를 가지는 것은 C 이다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "68. 품질위해관리(QRM) 활동은 연구소, 생산, QC, QA, 인 허가 부서의 전문가가 참석하는 팀으로 구성하여 진행하는 것이 바람직하며, 반드시 의사 결정권자가 참여할 필요는 없다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "69. 제품 개발 활동 중에서 주성분과 첨가제에 대한 모든 기본적인 물리 화학적 정보를 포함하고 있는 사전 처방화 프로파일 또는 제제 구성 성분들의 특성을 얻는 과정은 제제개발 과정이다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "70. 제품 개발 활동 중에서 세척 절차와 시험 방법의 개발과 관련한 정보를 얻는 과정은 공정개발 과정이다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "71. 원료약품은 밸리데이션의 대상 중 첫 단계의 대상이며, 원료물질에서의 품질변동은 규격에 맞지 않는 제품의 주요한 원인 중 하나이다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "72. 예측적 공정밸리데이션 공정의 검증 과정은 개발된 공정의 적절성을 확인하기 위한 과정이다. 이 때 공정의 변경을 진행하면서 이에 따른 제조의 재현성을 확인하는 것이 적절하다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "73. 고형제제의 공정 밸리데이션에서 요구되는 완제품 시험 항목으로서 과립입자분포, 개별무게, 붕해 등이 있다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "74. 정제 포뮬레이션 개발 중 계면활성제의 첨가는 약물의 용해도 향상과 관련이 있다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "75. 습식과립법에서 습식 분쇄 단위 조작을 위해서 사용되는 분석법으로는 칼 피셔법 등이 있다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "76. 정제 제조시 타정 공정에서, 압축되는 원료는 낮은 유동성과 높은 압축성이 필요하며, 높은 유동성은 hopper 안의 원료에 구멍을 만들고 정제 무게와 함량 균일성에 문제를 일으킬 수 있다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "77. 습식과립법 건조 공정이 적절하지 않을 때 과건조된 과립의 형성으로 인하여 capping, lamination 등이 발생할 수도 있다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "78. 완제품의 멸균여부를 판정하기 위해서는 비파괴시험인 무균시험으로 전수조사를 하는 것이 바람직하다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "79. 가열멸균공정의 밸리데이션에서, Log D값(Y축)과 온도(X축) 그래프의 선형그래프 기울기의 크기로부터 온도 증가에 따른 미생물의 상대적 치사 정도를 알 수 있다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "80. 맥시제식 주 [100ml]는 아세트아미노펜과 이부프로펜 성분으로 이루어진 주사제이다. 이 제품에 대한 증기멸균공정 FO는 최소한 18분 이상이 되어야한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "81. 증기멸균 공정밸리데이션에서 구리-콘스탄탄 열전대는 온도계로서 재현성이 있어야하며 가열영역에서 300도 이상을 견딜 수 있도록 충분한 내구성이 있어야만 한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "82. 가열멸균공정의 밸리데이션에서, 챔버온도와 시간 아래의 면적에 대한 적분값을 F값이라고 한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "83. 열에 불안정하며 다공성/단단한 제품에 대한 습열멸균공정 개발을 하고자 한다. 이 때 멸균 전 멸균대상물의 생물부하에 대한 지속적인 모니터링과 분석을 이용한 접근법을 이용한 포화증기 멸균공정이 적절하다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "84. Bowie-Dick 시험은 물리학적 적격성평가로서 적재된 멸균대상물에 대한 열 에너지의 침투력을 확인하여 멸균공정의 사멸능력을 평가하는 검사이다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "85. 멸균과정에서 열분포 측정을 위해서는 최소 10개의 열전대를 측정해야한다.", options: ["True", "False"], answer: 0 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "86. 같은 미생물부하와 노출상응시간이 같은 값을 가질 경우, 열에 내성이 약한 미생물은 열내성 미생물에 비해 B값이 크다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "87. 멸균 대상인 100 mL 부피를 가진 주사의 조제액을 사전에 정의된 공정조건으로 멸균공정을 실행하였을 때, 그 대상물이 최소한의 공정치사율(Fo) 값을 갖는다는 것을 증명하기 위하여 시행하는 시험을 열분포시험이라고 한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "88. 오븐식 멸균기 밸리데이션에서 열침투 반복시험을 할 때 콜드스팟, 시험 적재량, 노출 시간, 온도 설정값 등을 변화시키면서 검증하는 것이 바람직하다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "89. 멸균기의 적격성 평가를 위해서 쓰이는 구리-콘스탄탄 열전대의 정밀도는 +-2.5 이내로 교정되어야 한다.", options: ["True", "False"], answer: 1 },
        { guideline: "[2024 의약품제조관리학 중간]", text: "90. 세균부하시험은 시스템의 세균유지 특성을 결정하는 유일한 수단으로서 평균 직경이 0.2um 이하, 0.1um 이상인 Brevunmonas diminita (ATCC19146)을 사용하는 파괴시험이다.", options: ["True", "False"], answer: 1 }
    ];

    // 퀴즈 라이브러리 목록에 두 버전 모두 등록
    const quizLibrary = [
        {
            id: 'manufacturing_mid_2025',
            title: '2025 의약품제조관리학 중간',
            data: midQuizData2025
        },
        {
            id: 'manufacturing_mid_2024',
            title: '2024 의약품제조관리학 중간',
            data: midQuizData2024
        }
    ];

    let currentOriginalData = []; 
    let activeQuizData = [];      
    let currentQuestion = 0;
    let userAnswers = [];
    let flaggedQuestions = [];

    function showDashboard() {
        document.getElementById('dashboard-container').style.display = 'block';
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('app-sidebar').style.display = 'none';
        document.getElementById('breadcrumb-current').innerText = '퀴즈 목록';
        document.getElementById('mode-indicator').style.display = 'none';

        const grid = document.getElementById('quiz-grid');
        grid.innerHTML = '';
        
        quizLibrary.forEach(quiz => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.innerHTML = `
                <h3>${quiz.title}</h3>
                <p>총 ${quiz.data.length}문항</p>
                <button class="btn btn-primary" onclick="startQuiz('${quiz.id}')">이 퀴즈 풀기</button>
            `;
            grid.appendChild(card);
        });
    }

    function startQuiz(quizId) {
        const selectedQuiz = quizLibrary.find(q => q.id === quizId);
        currentOriginalData = selectedQuiz.data;
        activeQuizData = JSON.parse(JSON.stringify(currentOriginalData));
        
        document.getElementById('breadcrumb-current').innerText = selectedQuiz.title;
        document.getElementById('mode-indicator').style.display = 'inline';
        document.getElementById('dashboard-container').style.display = 'none';
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('app-sidebar').style.display = 'flex';
        
        resetQuizState();
        init();
    }

    function resetQuizState() {
        currentQuestion = 0;
        userAnswers = new Array(activeQuizData.length).fill(null);
        flaggedQuestions = new Array(activeQuizData.length).fill(false);
    }

    function shuffleQuiz() {
        if (!confirm('문항 순서를 무작위로 섞으시겠습니까?')) return;
        for (let i = activeQuizData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [activeQuizData[i], activeQuizData[j]] = [activeQuizData[j], activeQuizData[i]];
        }
        resetQuizState();
        init();
    }

    function resetOrder() {
        activeQuizData = JSON.parse(JSON.stringify(currentOriginalData));
        resetQuizState();
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('app-sidebar').style.display = 'flex';
        init();
    }

    function init() {
        renderNavGrid();
        renderQuestion(currentQuestion);
    }

    function renderNavGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = '';
        for (let i = 0; i < activeQuizData.length; i++) {
            const btn = document.createElement('div');
            btn.className = 'nav-btn';
            if (i === currentQuestion) btn.classList.add('active');
            if (userAnswers[i] !== null && userAnswers[i] !== '') btn.classList.add('answered');
            if (flaggedQuestions[i]) btn.classList.add('flagged');
            btn.innerText = i + 1;
            btn.onclick = () => { currentQuestion = i; renderQuestion(currentQuestion); };
            grid.appendChild(btn);
        }
    }

    function renderQuestion(index) {
        const q = activeQuizData[index];
        document.getElementById('q-number-display').innerText = `Question ${index + 1}`;
        const hasAns = userAnswers[index] !== null && userAnswers[index] !== '';
        document.getElementById('q-status-display').innerText = hasAns ? 'Answered' : 'Not yet answered';
        document.getElementById('flag-btn-display').innerHTML = flaggedQuestions[index] ? '🚩 Remove flag' : '🚩 Flag question';
        
        document.getElementById('guideline-display').innerHTML = q.guideline || '';
        document.getElementById('q-text-display').innerHTML = q.text;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        if (q.type === 'essay') {
            const area = document.createElement('textarea');
            area.className = 'essay-input';
            area.placeholder = '답안을 입력하세요...';
            area.value = userAnswers[index] || '';
            area.oninput = (e) => {
                userAnswers[currentQuestion] = e.target.value.trim() || null;
                renderNavGrid();
            };
            container.appendChild(area);
        } else {
            q.options.forEach((optText, optIdx) => {
                const label = document.createElement('label');
                label.className = 'option-label' + (userAnswers[currentQuestion] === optIdx ? ' selected' : '');
                label.innerHTML = `
                    <input type="radio" name="quiz-option" value="${optIdx}" ${userAnswers[currentQuestion] === optIdx ? 'checked' : ''}>
                    <span><strong>${optIdx + 1}.</strong> ${optText}</span>
                `;
                label.onclick = () => {
                    userAnswers[currentQuestion] = optIdx;
                    renderNavGrid();
                    renderQuestion(currentQuestion);
                };
                container.appendChild(label);
            });
        }
        
        document.getElementById('prev-btn').style.visibility = index === 0 ? 'hidden' : 'visible';
        const next = document.getElementById('next-btn');
        next.innerText = index === activeQuizData.length - 1 ? 'Finish attempt ...' : 'Next page';
        next.onclick = index === activeQuizData.length - 1 ? showResults : () => { currentQuestion++; renderQuestion(currentQuestion); };
    }

    function clearChoice() { 
        userAnswers[currentQuestion] = null; 
        renderNavGrid();
        renderQuestion(currentQuestion); 
    }
    
    function changeQuestion(s) { 
        currentQuestion += s; 
        renderQuestion(currentQuestion); 
    }
    
    function toggleFlag() { 
        flaggedQuestions[currentQuestion] = !flaggedQuestions[currentQuestion]; 
        renderNavGrid();
        renderQuestion(currentQuestion); 
    }

    function retryIncorrect() {
        const incorrect = activeQuizData.filter((q, i) => {
            if (q.type === 'essay') {
                const u = (userAnswers[i] || '').toLowerCase().replace(/\s+/g, '');
                const c = q.options[q.answer].toLowerCase().replace(/\s+/g, '');
                return u !== c;
            } else {
                return userAnswers[i] !== q.answer;
            }
        });
        
        if (incorrect.length === 0) return alert('모두 정답입니다!');
        activeQuizData = incorrect;
        resetQuizState();
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('app-sidebar').style.display = 'flex';
        init();
    }

    function showResults() {
        if (!confirm('제출하시겠습니까?')) return;
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('app-sidebar').style.display = 'none';
        document.getElementById('results-container').style.display = 'block';
        
        const list = document.getElementById('results-list');
        list.innerHTML = '';
        let score = 0;

        activeQuizData.forEach((q, i) => {
            let correct = false;
            let uText = '응답 안 함';
            let cText = '';

            if (q.type === 'essay') {
                cText = q.options[q.answer];
                const u = (userAnswers[i] || '').toLowerCase().replace(/\s+/g, '');
                const c = cText.toLowerCase().replace(/\s+/g, '');
                correct = u !== '' && u === c;
                uText = userAnswers[i] || '응답 안 함';
            } else {
                correct = userAnswers[i] === q.answer;
                cText = `${q.answer + 1}. ${q.options[q.answer]}`;
                if (userAnswers[i] !== null) {
                    uText = `${userAnswers[i] + 1}. ${q.options[userAnswers[i]]}`;
                }
            }
            
            if (correct) score++;
            
            const item = document.createElement('div');
            item.className = `result-item ${correct ? 'correct' : 'incorrect'}`;
            
            let statusHTML = `<span class="status-badge ${correct ? 'status-correct' : 'status-incorrect'}">${correct ? '✔ 정답' : '✘ 오답'}</span>`;

            item.innerHTML = `
                ${statusHTML}
                <div style="font-size:13px; color:#6f42c1; font-weight:bold;">${q.guideline || ''}</div>
                <div style="font-weight:bold; margin:8px 0 15px 0;">${q.text}</div>
                <div style="color:#6c757d; font-size:14px;">내가 선택한 답:<br> <span style="display:inline-block; margin-top:4px; padding:8px 12px; background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px; width:100%; box-sizing:border-box; color:#333;">${uText}</span></div>
                <div style="color:#6f42c1; font-weight:bold; font-size:14px; margin-top:10px;">정답:<br> <span style="display:inline-block; margin-top:4px; padding:8px 12px; background:#f9f5ff; border:1px solid #e2d9f3; border-radius:4px; width:100%; box-sizing:border-box; color:#333;">${cText}</span></div>
            `;
            list.appendChild(item);
        });
        
        document.getElementById('score-display').innerText = `${activeQuizData.length}문항 중 ${score}문항 정답 (${Math.round(score/activeQuizData.length*100)}%)`;
        document.getElementById('retry-incorrect-btn').style.display = score === activeQuizData.length ? 'none' : 'inline-block';
    }

    // 초기 화면 자동 실행
    showDashboard();
</script>
</body>
</html>
