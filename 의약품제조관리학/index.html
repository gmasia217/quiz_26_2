    const quizLibrary = [
        {
            id: 'manufacturing_mid_2025',
            title: '2025 의약품제조관리학 중간',
            data: midQuizData
        }
    ];

    let currentOriginalData = []; 
    let activeQuizData = [];      
    let currentQuestion = 0;
    let userAnswers = [];
    let flaggedQuestions = [];

    function showDashboard() {
        document.getElementById('dashboard-container').style.display = 'block';
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('app-sidebar').style.display = 'none';
        document.getElementById('breadcrumb-current').innerText = '퀴즈 목록';
        document.getElementById('mode-indicator').style.display = 'none';

        const grid = document.getElementById('quiz-grid');
        grid.innerHTML = '';
        
        quizLibrary.forEach(quiz => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.innerHTML = `
                <h3>${quiz.title}</h3>
                <p>총 ${quiz.data.length}문항</p>
                <button class="btn btn-primary" onclick="startQuiz('${quiz.id}')">이 퀴즈 풀기</button>
            `;
            grid.appendChild(card);
        });
    }

    function startQuiz(quizId) {
        const selectedQuiz = quizLibrary.find(q => q.id === quizId);
        currentOriginalData = selectedQuiz.data;
        activeQuizData = JSON.parse(JSON.stringify(currentOriginalData));
        
        document.getElementById('breadcrumb-current').innerText = selectedQuiz.title;
        document.getElementById('mode-indicator').style.display = 'inline';
        document.getElementById('dashboard-container').style.display = 'none';
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('app-sidebar').style.display = 'flex';
        
        resetQuizState();
        init();
    }

    function resetQuizState() {
        currentQuestion = 0;
        userAnswers = new Array(activeQuizData.length).fill(null);
        flaggedQuestions = new Array(activeQuizData.length).fill(false);
    }

    function shuffleQuiz() {
        if (!confirm('문항 순서를 무작위로 섞으시겠습니까?')) return;
        for (let i = activeQuizData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [activeQuizData[i], activeQuizData[j]] = [activeQuizData[j], activeQuizData[i]];
        }
        resetQuizState();
        init();
    }

    function resetOrder() {
        activeQuizData = JSON.parse(JSON.stringify(currentOriginalData));
        resetQuizState();
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('app-sidebar').style.display = 'flex';
        init();
    }

    function init() {
        renderNavGrid();
        renderQuestion(currentQuestion);
    }

    function renderNavGrid() {
        const grid = document.getElementById('nav-grid');
        grid.innerHTML = '';
        for (let i = 0; i < activeQuizData.length; i++) {
            const btn = document.createElement('div');
            btn.className = 'nav-btn';
            if (i === currentQuestion) btn.classList.add('active');
            if (userAnswers[i] !== null && userAnswers[i] !== '') btn.classList.add('answered');
            if (flaggedQuestions[i]) btn.classList.add('flagged');
            btn.innerText = i + 1;
            btn.onclick = () => { currentQuestion = i; renderQuestion(currentQuestion); };
            grid.appendChild(btn);
        }
    }

    function renderQuestion(index) {
        const q = activeQuizData[index];
        document.getElementById('q-number-display').innerText = `Question ${index + 1}`;
        const hasAns = userAnswers[index] !== null && userAnswers[index] !== '';
        document.getElementById('q-status-display').innerText = hasAns ? 'Answered' : 'Not yet answered';
        document.getElementById('flag-btn-display').innerHTML = flaggedQuestions[index] ? '🚩 Remove flag' : '🚩 Flag question';
        
        document.getElementById('guideline-display').innerHTML = q.guideline || '';
        document.getElementById('q-text-display').innerHTML = q.text;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        if (q.type === 'essay') {
            const area = document.createElement('textarea');
            area.className = 'essay-input';
            area.placeholder = '답안을 입력하세요...';
            area.value = userAnswers[index] || '';
            area.oninput = (e) => {
                userAnswers[currentQuestion] = e.target.value.trim() || null;
                renderNavGrid();
            };
            container.appendChild(area);
        } else {
            q.options.forEach((optText, optIdx) => {
                const label = document.createElement('label');
                label.className = 'option-label' + (userAnswers[currentQuestion] === optIdx ? ' selected' : '');
                label.innerHTML = `
                    <input type="radio" name="quiz-option" value="${optIdx}" ${userAnswers[currentQuestion] === optIdx ? 'checked' : ''}>
                    <span><strong>${optIdx + 1}.</strong> ${optText}</span>
                `;
                label.onclick = () => {
                    userAnswers[currentQuestion] = optIdx;
                    renderNavGrid();
                    renderQuestion(currentQuestion);
                };
                container.appendChild(label);
            });
        }
        
        document.getElementById('prev-btn').style.visibility = index === 0 ? 'hidden' : 'visible';
        const next = document.getElementById('next-btn');
        next.innerText = index === activeQuizData.length - 1 ? 'Finish attempt ...' : 'Next page';
        next.onclick = index === activeQuizData.length - 1 ? showResults : () => { currentQuestion++; renderQuestion(currentQuestion); };
    }

    function clearChoice() { 
        userAnswers[currentQuestion] = null; 
        renderNavGrid();
        renderQuestion(currentQuestion); 
    }
    
    function changeQuestion(s) { 
        currentQuestion += s; 
        renderQuestion(currentQuestion); 
    }
    
    function toggleFlag() { 
        flaggedQuestions[currentQuestion] = !flaggedQuestions[currentQuestion]; 
        renderNavGrid();
        renderQuestion(currentQuestion); 
    }

    function retryIncorrect() {
        const incorrect = activeQuizData.filter((q, i) => {
            if (q.type === 'essay') {
                const u = (userAnswers[i] || '').toLowerCase().replace(/\s+/g, '');
                const c = q.options[q.answer].toLowerCase().replace(/\s+/g, '');
                return u !== c;
            } else {
                return userAnswers[i] !== q.answer;
            }
        });
        
        if (incorrect.length === 0) return alert('모두 정답입니다!');
        activeQuizData = incorrect;
        resetQuizState();
        document.getElementById('results-container').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('app-sidebar').style.display = 'flex';
        init();
    }

    function showResults() {
        if (!confirm('제출하시겠습니까?')) return;
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('app-sidebar').style.display = 'none';
        document.getElementById('results-container').style.display = 'block';
        
        const list = document.getElementById('results-list');
        list.innerHTML = '';
        let score = 0;

        activeQuizData.forEach((q, i) => {
            let correct = false;
            let uText = '응답 안 함';
            let cText = '';

            if (q.type === 'essay') {
                cText = q.options[q.answer];
                const u = (userAnswers[i] || '').toLowerCase().replace(/\s+/g, '');
                const c = cText.toLowerCase().replace(/\s+/g, '');
                correct = u !== '' && u === c;
                uText = userAnswers[i] || '응답 안 함';
            } else {
                correct = userAnswers[i] === q.answer;
                cText = `${q.answer + 1}. ${q.options[q.answer]}`;
                if (userAnswers[i] !== null) {
                    uText = `${userAnswers[i] + 1}. ${q.options[userAnswers[i]]}`;
                }
            }
            
            if (correct) score++;
            
            const item = document.createElement('div');
            item.className = `result-item ${correct ? 'correct' : 'incorrect'}`;
            
            let statusHTML = `<span class="status-badge ${correct ? 'status-correct' : 'status-incorrect'}">${correct ? '✔ 정답' : '✘ 오답'}</span>`;

            item.innerHTML = `
                ${statusHTML}
                <div style="font-size:13px; color:#6f42c1; font-weight:bold;">${q.guideline || ''}</div>
                <div style="font-weight:bold; margin:8px 0 15px 0;">${q.text}</div>
                <div style="color:#6c757d; font-size:14px;">내가 선택한 답:<br> <span style="display:inline-block; margin-top:4px; padding:8px 12px; background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px; width:100%; box-sizing:border-box; color:#333;">${uText}</span></div>
                <div style="color:#6f42c1; font-weight:bold; font-size:14px; margin-top:10px;">정답:<br> <span style="display:inline-block; margin-top:4px; padding:8px 12px; background:#f9f5ff; border:1px solid #e2d9f3; border-radius:4px; width:100%; box-sizing:border-box; color:#333;">${cText}</span></div>
            `;
            list.appendChild(item);
        });
        
        document.getElementById('score-display').innerText = `${activeQuizData.length}문항 중 ${score}문항 정답 (${Math.round(score/activeQuizData.length*100)}%)`;
        document.getElementById('retry-incorrect-btn').style.display = score === activeQuizData.length ? 'none' : 'inline-block';
    }

    // 초기 화면 자동 실행
    showDashboard();
</script>
</body>
</html>
